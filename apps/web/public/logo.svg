<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Scatter Gather Agent Viewer logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- scatter: source fans out to three parallel workers -->
  <path d="M14 32 C22 32 22 16 30 16 M14 32 L30 32 M14 32 C22 32 22 48 30 48" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- gather: workers converge on the aggregator -->
  <path d="M34 16 C42 16 42 32 50 32 M34 32 L50 32 M34 48 C42 48 42 32 50 32" fill="none" stroke="url(#edge)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- nodes -->
  <circle cx="14" cy="32" r="5" fill="#22d3ee"/>
  <circle cx="32" cy="16" r="4" fill="#e2e8f0"/>
  <circle cx="32" cy="32" r="4" fill="#e2e8f0"/>
  <circle cx="32" cy="48" r="4" fill="#e2e8f0"/>
  <circle cx="50" cy="32" r="5.5" fill="#a78bfa"/>
</svg>
